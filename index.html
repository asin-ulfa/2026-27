<style>
:root{
  /* Layout: a Sankey river read left to right; students form the main band, meetings flow in from above, submissions branch off below, and every result keeps flowing so the band widens; only one theme is open at a time, like an accordion, and shows its items in place */
  --paper:#f6f5f0; --ink:#1b1c1e; --muted:#6c6d70; --line:#dedcd4; --panel:#ffffff;
  --cyan:#2aa7d8; --magenta:#d23d97; --yellow:#e9cf3c; --black:#8a4f3d; --student:#4b5a52;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{--paper:#141513;--ink:#ecebe6;--muted:#9c9b95;--line:#2c2c29;--panel:#1d1e1c;--student:#a3b5ab;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px;padding:12px 20px 10px;border-bottom:1px solid var(--line)}
.top h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.top h1 span{font-weight:400;color:var(--muted)}
.top p{margin:0;color:var(--muted);font-size:13px;max-width:72ch}
.tgl{display:flex;gap:8px;margin-left:auto;align-self:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;align-self:center}
.lang button{border:0;background:transparent;padding:4px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang svg{width:14px;height:14px;display:block}
.flow{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth;overscroll-behavior-x:contain;position:relative}
@media (prefers-reduced-motion: reduce){.flow{scroll-behavior:auto}}
.stage{position:relative}
.stage svg{display:block}
.lbl{position:absolute;font-family:var(--display);line-height:1.15;pointer-events:none;white-space:nowrap}
.lbl.on-band{color:#fff;font-weight:600;font-size:15px;text-shadow:0 0 2px rgba(0,0,0,.25)}
.hit{cursor:pointer}
.hit:hover{filter:brightness(1.08)}
.hit.sel{filter:brightness(1.1) saturate(1.2)}
.term{position:absolute;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--display)}
.term .n{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;display:block;line-height:1}
.term .t{font-size:14px;display:block;margin-top:3px;max-width:150px;white-space:normal}
.term .s{font-size:12px;color:var(--muted);display:block;max-width:150px;white-space:normal;font-style:italic}
.term.planned .n{color:var(--muted)}
.term[aria-pressed="true"] .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ulfa{display:flex;align-items:center;align-self:center;padding-right:18px;border-right:1px solid var(--line)}
.ulfa img{display:block;height:44px;width:auto}
.logo-w{display:none!important}:root[data-theme="dark"] .logo-w{display:block!important}:root[data-theme="dark"] .logo-b{display:none!important}
.ttl{display:grid;gap:3px;align-self:center}
.facts{font-size:12.5px;color:var(--muted)}.facts b{color:var(--ink);font-weight:600}.facts a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.head{transition:width .22s ease,padding .22s ease,margin .22s ease,background-color .22s ease,box-shadow .22s ease}
.head .more{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:4px}
.head .peek{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .22s ease,opacity .18s ease}
.head .peek>div{overflow:hidden;font-family:var(--body);font-size:12.5px;line-height:1.35;white-space:normal}
.head .peek .go{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--cyan)}
.head.peeking{width:300px!important;z-index:6;background:var(--panel);padding:8px 12px 10px;margin:-8px 0 0 -12px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.16)}
.head.peeking .peek{grid-template-rows:1fr;opacity:1}
.head.peeking .more{display:none}
.ph{display:inline-block;margin:0 0 6px;padding:1px 7px;border:1px dashed var(--muted);border-radius:999px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.colhit{cursor:pointer}.colhit.peeking{fill:var(--ink);fill-opacity:.045}
.head{position:absolute;top:10px;width:230px;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.head .num{font-family:var(--mono);font-size:11px;color:var(--muted)}
.head h2{font-family:var(--display);font-size:17px;font-weight:700;margin:2px 0 0;line-height:1.15;text-wrap:balance}
.head .st{font-family:var(--body);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:0 7px;border:1px solid currentColor;margin-left:4px}
.head.now h2{color:var(--cyan)}
.head.planned h2{color:var(--muted)}
.head[aria-pressed="true"] h2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

.drawer{height:min(42vh,340px);border-top:2px solid var(--ink);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.dh{display:flex;align-items:baseline;gap:10px 18px;flex-wrap:wrap;padding:10px 20px 6px}
.dh h3{font-family:var(--display);font-size:18px;margin:0;font-weight:700}
.dh .sl{color:var(--muted);font-style:italic;font-size:13px}
.dh .why{font-size:13px;color:var(--ink);max-width:80ch;margin:0;flex-basis:100%}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:400}
.kpi .l{font-size:11px;color:var(--muted)}
.items{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;display:flex;gap:12px;padding:8px 20px 14px;align-items:stretch}
.card{flex:none;width:220px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--c,var(--ink));border-radius:6px;padding:8px 10px;overflow:auto}
.card h4{font-size:13.5px;margin:0 0 2px;font-weight:600;text-wrap:balance}
.card .who{font-size:12px;color:var(--muted)}
.card .sl{font-size:12px;color:var(--muted);font-style:italic}
.card .dt{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.card.planned{border-style:dashed;background:transparent}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;margin:0 0 6px;background:var(--line);cursor:pointer}
.ico{display:block;width:100%;height:56px;color:var(--c);margin-bottom:6px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--panel);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-disabled="true"]{cursor:default;opacity:.55}
.chip.v::before{content:"▶ ";font-size:9px}
.strip{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.strip img{width:58px;aspect-ratio:16/9;object-fit:cover;border-radius:3px;border:1px solid var(--line);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,12,14,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.open{display:flex}
.vw{background:var(--panel);color:var(--ink);border-radius:8px;width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.vh{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.vh h2{font-size:14px;margin:0;flex:1;text-wrap:balance}
.vh button,.vf button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;cursor:pointer}
.vb{background:#000;display:flex;align-items:center;justify-content:center;flex:1;min-height:200px}
.vb video,.vb img{max-width:100%;max-height:calc(100vh - 170px);display:block}
.vf{display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap;border-top:1px solid var(--line);font-size:12.5px}
.vf .sp{flex:1}
.vf button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cnt{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:600px){.top{padding:10px 12px}.dh,.items{padding-left:12px;padding-right:12px}.drawer{height:46vh}}
</style>
</head>

const tr=(en,sl)=>LANG==="sl"?(sl!=null?sl:en):en;
const plSl=(n,f)=>{const m=n%100;return m===1?f[0]:m===2?f[1]:(m===3||m===4)?f[2]:f[3]};
const stage=document.getElementById("stage"),flow=document.getElementById("flow");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function chip(label,key,isVideo,title,labelSl){label=tr(label,labelSl);const has=!!MEDIA[key];return `<button type="button" class="chip${isVideo?" v":""}" data-key="${key}" data-title="${esc(title)}" ${has?"":'aria-disabled="true" title="File not added yet"'}>${esc(label)}</button>`}
function thumbImg(key,title){const t=THUMB[key];return t?`<img class="thumb" src="${t}" alt="" loading="lazy" data-key="${key}" data-title="${esc(title)}">`:""}
// items below the band for a theme
function outItems(p){
  if(p.down==="pk")return PK.map(x=>{const n=STUDENTS[x.who],k="pk_"+x.who;return{u:1,c:p.c,html:`${thumbImg(k,"PechaKucha · "+n)}<h4>${esc(tr(x.h||"Workshop I attended",x.hs||"Delavnica, ki sem se je udeležil"))}</h4><div class="who">${esc(n)}</div><div class="meta">${chip("Slides",k,false,"PechaKucha · "+n,"Prosojnice")}</div>`}});
  if(p.down==="tk")return TOOLKIT.map(t=>{const n=STUDENTS[t.who];let m="";if(t.video)m+=chip("Video","tv_"+t.who,true,tr(t.type,t.sl)+" · "+n,"Video");if(t.pres)m+=chip("Presentation","tk_"+t.who,false,tr(t.type,t.sl)+" · "+n,"Predstavitev");return{u:(t.pres?1:0)+(t.video?1:0),c:p.c,html:`${thumbImg("tv_"+t.who,t.type)||thumbImg("tk_"+t.who,t.type)}<h4>${esc(tr(t.type,t.sl))}</h4><div class="sl">${esc(tr(t.sl,t.type))}</div><div class="who">${esc(n)}</div><div class="meta">${m}</div>`}});
  return p.down.map(o=>({u:o.u||1,c:p.c,planned:o.planned,html:`${o.ph?`<span class="ph">${tr("Placeholder · TNP slide","Začasni primer · prosojnica TNP")}</span>`:""}${o.img?`<img class="thumb" src="${T(o.img[0])}" alt="" data-key="tnp_slides" data-idx="${o.img[1]}" data-title="TNP slides">`:""}<h4>${esc(tr(o.h,o.sl))}</h4>${o.sl?`<div class="sl">${esc(tr(o.sl,o.h))}</div>`:""}${o.dt?`<div class="dt">${esc(o.dt)}</div>`:""}`}));
}
function inItems(p){
  return p.up.map(o=>({planned:o.planned,html:`${o.key?thumbImg(o.key,tr(o.h,o.sl)):""}<h4>${esc(tr(o.h,o.sl))}</h4>${o.sl?`<div class="sl">${esc(tr(o.sl,o.h))}</div>`:""}${o.dt?`<div class="dt">${esc(o.dt)}</div>`:""}${o.media?`<div class="meta">${o.media.map(m=>chip(m[0],m[1],m[2],o.h,m[3])).join("")}</div>`:""}${o.strip?`<div class="strip">${[0,1,2,3,4,5,6,7].map(i=>`<img src="${M}thumbs/tnp_part0${i}.jpg" alt="Part ${i+1}" loading="lazy" data-key="tnp_video" data-idx="${i}" data-title="${esc(o.h)}">`).join("")}</div>`:""}`}));
}
PHASES.forEach(p=>{p.out=outItems(p).reduce((a,b)=>a+b.u,0)});
const PICK=(location.hash.slice(1)&&PHASES.find(p=>p.id===location.hash.slice(1)))?location.hash.slice(1):"tnp";
let openId=PICK;

function kpiHtml(k){const val=k.of!=null?`${k.v}<small>/${k.of}</small>`:`${esc(tr(k.v,k.vs))}${k.u?`<small> ${k.u}</small>`:""}`;return `<div class="kpi"><div class="v">${val}</div><div class="l">${esc(tr(k.l,k.ls))}</div></div>`}
function ribbon(x0,y0,x1,y1,w0,w1,fill,op,cls,data){
  const my=(y0+y1)/2;
  // vertical-ish ribbon: (x0,y0) top centre to (x1,y1) bottom centre, widths w0/w1 horizontal
  return `<path${cls?` class="${cls}"`:""}${data||""} d="M${x0-w0/2} ${y0} C ${x0-w0/2} ${my}, ${x1-w1/2} ${my}, ${x1-w1/2} ${y1} L ${x1+w1/2} ${y1} C ${x1+w1/2} ${my}, ${x0+w0/2} ${my}, ${x0+w0/2} ${y0} Z" fill="${fill}" fill-opacity="${op}"/>`;
}
function headHtml(cl,i,open,Wo,Wc){
  const p=cl.p,st=LANG==="sl"?{done:"zaključeno",now:"v teku",planned:"načrtovano"}[p.status]:{done:"done",now:"in progress",planned:"planned"}[p.status];
  return `<button type="button" class="head ${p.status}" data-open="${p.id}" aria-pressed="${open}" style="left:${cl.x+12}px;width:${open?Wo-30:Wc-18}px"><span class="num">${String(i+1).padStart(2,"0")} · ${esc(p.dates)}${open?`<span class="st">${st}</span>`:""}</span><h2 style="font-size:${open?22:14}px">${esc(open?tr(p.title,p.sl):tr(p.title,p.sl).split(":")[0])}${open?"":`<span class="more" aria-hidden="true">›</span>`}</h2>${open?"":`<span class="peek"><div>${esc(tr(p.why,p.whySl))}<br><span class="go">${tr("Click to open ›","Klikni za odprtje ›")}</span></div></span>`}${open?`<div style="font-family:var(--body);font-size:13px;color:var(--muted);font-style:italic">${esc(tr(p.sl,p.title))}</div><p style="font-family:var(--body);font-size:13px;margin:6px 0 0;max-width:62ch;white-space:normal">${esc(tr(p.why,p.whySl))}</p><div class="kpis" style="margin:10px 0 0;justify-content:flex-start">${p.kpis.map(kpiHtml).join("")}</div>`:""}</button>`;
}
const KA=0.5523;
// one strand: rises from below in a vertical stem, turns with rounded corners and continues right in the band
function elbow(vx,y,w,endX,ty,Ro,Ri){
  Ro=Math.min(Ro,ty-y-4);Ri=Math.max(4,Ri);
  return `M${vx+Ro} ${y} L ${endX} ${y} L ${endX} ${y+w} L ${vx+w+Ri} ${y+w} C ${vx+w+Ri-KA*Ri} ${y+w}, ${vx+w} ${y+w+Ri-KA*Ri}, ${vx+w} ${y+w+Ri} L ${vx+w} ${ty} L ${vx} ${ty} L ${vx} ${y+Ro} C ${vx} ${y+Ro-KA*Ro}, ${vx+Ro-KA*Ro} ${y}, ${vx+Ro} ${y} Z`;
}
function draw(){
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue("--"+n).trim();
  const U=3.2, Wc=118, Wo=Math.max(560,Math.min(760,flow.clientWidth-Wc*PHASES.length+Wc-160));
  const X0=150;
  let x=X0;const cols=PHASES.map(p=>{const w=p.id===openId?Wo:Wc;const c={p,x,w,nx:x+28};x+=w;return c});
  // measuring pass: header and meeting cards of the open theme decide where the band sits
  const oc=cols.find(c=>c.p.id===openId);
  stage.innerHTML=headHtml(oc,cols.indexOf(oc),true,Wo,Wc)+`<div id="mt" style="position:absolute;left:${oc.x+20}px;top:0;display:flex;gap:12px;align-items:flex-start;width:${Wo-40}px">${inItems(oc.p).map(it=>`<div class="card${it.planned?" planned":""}" style="flex:1 1 0;max-width:240px;--c:${col(oc.p.c)}">${it.html}</div>`).join("")}</div>`;
  const hb=stage.querySelector(".head");const mt=stage.querySelector("#mt");
  const mtTop=hb.offsetTop+hb.offsetHeight+16;mt.style.top=mtTop+"px";
  const BT=Math.max(250,mtTop+mt.offsetHeight+48);
  const mcards=[...mt.children].map(e=>({l:e.offsetLeft+oc.x+20,w:e.offsetWidth,b:mtTop+e.offsetTop+e.offsetHeight}));
  const mtHtml=mt.outerHTML;
  const endX=x+70;
  let html="",svg="",defs="",bg="";
  ["cyan","magenta","yellow","black","student"].forEach(c=>{defs+=`<pattern id="h-${c}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="${col(c)}" fill-opacity=".18"/><rect width="2.6" height="7" fill="${col(c)}" fill-opacity=".75"/></pattern>`});
  // layers of the band
  const layers=[{c:"student",w:N*U,x0:20,label:`${N} students`}];
  cols.forEach(cl=>{if(cl.p.out)layers.push({c:cl.p.c,w:cl.p.out*U,x0:cl.nx,planned:cl.p.status!=="done",id:cl.p.id})});
  let off=BT;layers.forEach(L=>{L.y=off;off+=L.w});
  const bandBottomAt=xx=>layers.filter(L=>L.x0<=xx).reduce((a,L)=>Math.max(a,L.y+L.w),BT);
  // draw layers
  layers.filter(L=>!L.id).forEach(L=>{
    const fill=L.planned?`url(#h-${L.c})`:col(L.c);
    svg+=`<path class="hit"${L.id?` data-open="${L.id}"`:""} d="M${L.x0} ${L.y} L ${endX} ${L.y} L ${endX} ${L.y+L.w} L ${L.x0} ${L.y+L.w} Z" fill="${fill}" fill-opacity="${L.planned?1:.92}"/>`;
  });
  html+=`<div class="lbl" style="left:20px;top:${BT-26}px;font-size:14px;font-weight:600">${N}</div><div class="lbl on-band" style="left:28px;top:${BT+4}px;font-size:13px">${tr("students","študentov")}</div>`;
  html+=`<div class="lbl" style="left:${endX+8}px;top:${BT-4}px;font-size:13px;color:var(--muted)">${layers.reduce((a,L)=>a+(L.c==="student"?0:L.w/U),0)} ${tr("results<br>planned and done","rezultatov,<br>načrtovanih in opravljenih")}</div>`;
  // theme columns
  cols.forEach((cl,i)=>{
    const p=cl.p,open=p.id===openId,c=p.c,planned=p.status!=="done",fill=planned?`url(#h-${c})`:col(c);
    if(!open)bg+=`<rect class="colhit" data-open="${p.id}" x="${cl.x}" y="0" width="${cl.w}" height="4000" fill="transparent"/>`;
    // separator
    svg+=`<line x1="${cl.x}" y1="0" x2="${cl.x}" y2="2000" stroke="${col("line")}" stroke-width="1"/>`;
    html+=headHtml(cl,i,open,Wo,Wc);
    // meetings inflow
    const ins=inItems(p);
    if(ins.length){
      if(open){
        html+=mtHtml;
        mcards.forEach((m,j)=>{svg+=ribbon(m.l+m.w/2,m.b,cl.nx+6+j*7,BT,5,5,col(c),planned?.4:.8)});
      }else{
        svg+=ribbon(cl.nx+8,BT-60,cl.nx+8,BT,ins.length*4,ins.length*4,col(c),planned?.35:.7,"hit",` data-open="${p.id}"`);
        html+=`<div class="lbl" style="left:${cl.nx+16+ins.length*2}px;top:${BT-62}px;font-size:12px;color:var(--muted)">${ins.length} ${tr(ins.length>1?"meetings":"meeting",plSl(ins.length,["srečanje","srečanji","srečanja","srečanj"]))}</div>`;
      }
    }
    // results branch
    const outs=outItems(p);
    const L=layers.find(L=>L.id===p.id);
    if(outs.length&&L){
      const bb=bandBottomAt(cl.x+cl.w);
      if(open){
        const per=Math.max(1,Math.floor((Wo-40)/232));const cw=Math.min(220,(Wo-40)/per-12);
        const top=bandBottomAt(endX)+70;
        const stemB=top-60;
        svg+=`<path class="hit" data-open="${p.id}" d="${elbow(cl.nx,L.y,L.w,endX,stemB,L.w+14,12)}" fill="${fill}" fill-opacity="${planned?1:.92}"/>`;
        let acc=0;
        outs.forEach((it,j)=>{
          const r=Math.floor(j/per),k=j%per;const cx=cl.x+20+k*(cw+12),cy=top+r*250;
          html+=`<div class="card${it.planned?" planned":""}" style="position:absolute;left:${cx}px;top:${cy}px;width:${cw}px;--c:${col(c)}">${it.html}</div>`;
          const w=it.u*U;
          if(r===0)svg+=ribbon(cl.nx+acc+w/2,stemB-1,cx+cw/2,cy,w,Math.max(w,6),fill,planned?1:.8);
          else svg+=ribbon(cl.nx+acc+w/2,stemB-1,cx-6,cy+20,w,3,fill,planned?.6:.45);
          acc+=w;
        });
        html+=`<div class="lbl" style="left:${cl.nx+L.w+16}px;top:${L.y+L.w+18}px;font-size:13px;color:var(--muted)">${p.out} ${p.down==="tk"?tr("items",plSl(p.out,["izdelek","izdelka","izdelki","izdelkov"])):tr("submissions",plSl(p.out,["oddaja","oddaji","oddaje","oddaj"]))}</div>`;
        cl.h=top+Math.ceil(outs.length/per)*250;
      }else{
        const ty=bandBottomAt(endX)+70;
        svg+=`<path class="hit" data-open="${p.id}" d="${elbow(cl.nx,L.y,L.w,endX,ty,L.w+14,12)}" fill="${fill}" fill-opacity="${planned?1:.92}"/>`;
        html+=`<button type="button" class="term${planned?" planned":""}" data-open="${p.id}" style="left:${cl.nx}px;top:${ty+6}px"><span class="n">${p.out}</span><span class="t" style="max-width:${Wc-34}px">${p.down==="pk"?"PechaKucha":p.down==="tk"?tr("toolkit items","izdelkov za nabor orodij"):esc(tr((p.down[0]||{}).h||"",(p.down[0]||{}).sl))}</span></button>`;
      }
    }
  });
  const H=Math.max(flow.clientHeight-4,...cols.map(c=>c.h||0),bandBottomAt(endX)+180);
  stage.style.width=(endX+150)+"px";stage.style.height=H+"px";
  stage.innerHTML=`<svg width="${endX+150}" height="${H}" viewBox="0 0 ${endX+150} ${H}" aria-hidden="true"><defs>${defs}</defs>${bg}${svg}</svg>${html}`;
  return cols.find(c=>c.p.id===openId);
}
function openTheme(id,scroll){openId=id;peekId=null;const cl=draw();if(scroll!==false&&cl)flow.scrollTo({left:Math.max(0,cl.x-140)});history.replaceState(null,"","#"+id)}
let peekId=null;function peek(id){if(id===peekId)return;peekId=id;stage.querySelectorAll(".peeking").forEach(e=>e.classList.remove("peeking"));if(id&&id!==openId)stage.querySelectorAll(`.head[data-open="${id}"],.colhit[data-open="${id}"]`).forEach(e=>e.classList.add("peeking"))}
stage.addEventListener("pointerover",e=>{if(e.pointerType==="touch")return;const o=e.target.closest("[data-open]");peek(o?o.dataset.open:null)});
stage.addEventListener("pointerleave",()=>peek(null));
stage.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o&&!e.target.closest("[data-key]")){openTheme(o.dataset.open)}});
window.addMedia=(o,th)=>{Object.assign(MEDIA,o);if(th)Object.assign(THUMB,th);draw()};
window.addEventListener("resize",()=>draw());
// viewer
const ov=document.getElementById("ov"),vbody=document.getElementById("vbody"),vfoot=document.getElementById("vfoot"),vtitle=document.getElementById("vtitle");
let cur=null,idx=0,lastFocus=null;
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function show(){
  vbody.innerHTML="";vfoot.innerHTML="";
  if(cur.parts){
    const v=document.createElement("video");v.controls=true;v.preload="metadata";v.playsInline=true;v.src=cur.parts[idx];vbody.appendChild(v);
    v.addEventListener("ended",()=>{if(idx<cur.parts.length-1){idx++;show();vbody.querySelector("video").play().catch(()=>{})}});
    if(cur.parts.length>1){vfoot.appendChild(el("span","cnt",tr("Part","Del")));cur.parts.forEach((p,i)=>{const b=el("button",i===idx?"on":"",String(i+1));b.type="button";b.onclick=()=>{idx=i;show()};vfoot.appendChild(b)});vfoot.appendChild(el("span","sp"));vfoot.appendChild(el("span","cnt",tr("about 10 min each, plays on","po približno 10 min, predvaja se naprej")))}
  }else{
    const im=document.createElement("img");im.src=cur.imgs[idx];im.alt=vtitle.textContent+", slide "+(idx+1);vbody.appendChild(im);
    const p=el("button","",tr("← Previous","← Prejšnja"));p.type="button";p.disabled=idx===0;p.onclick=()=>step(-1);
    const n=el("button","",tr("Next →","Naslednja →"));n.type="button";n.disabled=idx===cur.imgs.length-1;n.onclick=()=>step(1);
    vfoot.append(p,n,el("span","sp"),el("span","cnt",`${idx+1} / ${cur.imgs.length}`));
    if(cur.imgs[idx+1]){const pre=new Image();pre.src=cur.imgs[idx+1]}
  }
}
function step(d){if(!cur||!cur.imgs)return;idx=Math.max(0,Math.min(cur.imgs.length-1,idx+d));show()}
function open(key,title,start){const m=MEDIA[key];if(!m)return;cur=m;idx=start||0;vtitle.textContent=title||"";lastFocus=document.activeElement;ov.classList.add("open");show();document.getElementById("vclose").focus()}
function close(){ov.classList.remove("open");vbody.innerHTML="";cur=null;if(lastFocus)lastFocus.focus()}
document.addEventListener("click",e=>{const c=e.target.closest("[data-key]");if(!c||c.getAttribute("aria-disabled")==="true")return;open(c.dataset.key,c.dataset.title,+(c.dataset.idx||0))});
document.getElementById("vclose").onclick=close;
ov.addEventListener("click",e=>{if(e.target===ov)close()});
document.addEventListener("keydown",e=>{if(!ov.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});

flow.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&!e.shiftKey&&flow.scrollHeight<=flow.clientHeight+4){flow.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
function setLang(l){LANG=l;try{localStorage.setItem("aisn_lang",l)}catch(e){}document.documentElement.lang=l;
  document.getElementById("intro").textContent=tr("Read left to right. The band is the course: meetings flow in from above, your work branches off below and keeps flowing, so the band widens. One theme is open at a time: click another theme to open it.","Beri od leve proti desni. Tok je predmet: srečanja pritekajo od zgoraj, vaše oddaje se odcepijo navzdol in tečejo naprej, zato se tok širi. Hkrati je odprta ena tema: za odprtje druge klikni nanjo.");
  document.getElementById("vclose").textContent=tr("Close","Zapri");
  const lg=l==="en"?"en":"sl";document.getElementById("logoB").src=`brand/ul_fa_logo_hor_black_${lg}_v1_2026-11-14.png`;document.getElementById("logoW").src=`brand/ul_fa_logo_hor_white_${lg}_v1_2026-11-14.png`;
  document.getElementById("cname").textContent=tr("· Action and Strategic Planning","· Akcijsko in strateško načrtovanje");
  const cu=tr("https://www.fa.uni-lj.si/en/predmet/action-and-strategic-planning/","https://www.fa.uni-lj.si/predmet/akcijsko-in-stratesko-nacrtovanje/");
  document.getElementById("facts").innerHTML=`${tr("Course holder","Nosilec predmeta")}: <b>doc. dr. Tomaž Berčič</b> · ${tr("Year 5, winter semester, elective","5. letnik, zimski semester, izbirni predmet")} · <a href="${cu}" target="_blank" rel="noopener">${tr("Course page","Spletna stran predmeta")} ↗</a>`;
  document.querySelectorAll(".lang button[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  draw();}
document.querySelectorAll(".lang button[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("aisn_theme",t)}catch(e){}document.querySelectorAll(".lang button[data-theme]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.theme===t));draw()}
document.querySelectorAll(".lang button[data-theme]").forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
{let t="light";try{t=localStorage.getItem("aisn_theme")||"light"}catch(e){}setTheme(t)}
setLang(LANG);
requestAnimationFrame(()=>openTheme(openId));
</script>
